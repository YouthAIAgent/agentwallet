<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>agentwallet — 2-Min Launch Video</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, rgba(0,187,127,.12), transparent 60%), #050807;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    justify-content: center; font-family: ui-monospace, "Cascadia Code", Menlo, monospace;
    color: #e8f5ef; padding: 24px; gap: 16px;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: .25em; text-transform: uppercase;
    color: #00bb7f; border: 1px solid rgba(0,187,127,.3); background: rgba(0,187,127,.06);
    padding: 6px 14px; border-radius: 999px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #00bb7f; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  h1 { font-size: clamp(16px, 3vw, 24px); font-weight: 700; letter-spacing: -.02em; text-align: center; }
  video {
    width: min(960px, 100%); border-radius: 12px; border: 1px solid rgba(0,187,127,.25);
    box-shadow: 0 0 60px -18px rgba(0,187,127,.45), 0 24px 60px -30px rgba(0,0,0,.8);
    background: #000; outline: none;
  }
  .hint { font-size: 12px; color: #5c6f66; text-align: center; }
</style>
</head>
<body>
  <span class="badge"><span class="dot"></span>AgentWallet · Launch Video · 2 min</span>
  <h1>The payment rail for the agent economy</h1>
  <video id="v" controls autoplay playsinline preload="auto" src="/_launch.mp4"></video>
  <p class="hint">Controls: play/pause · seek · fullscreen — attach this file to the first X post.</p>
  <script>
    const v = document.getElementById('v');
    v.muted = true;
    v.play().catch(() => {});
    v.addEventListener('click', () => { v.muted = false; });
  </script>
</body>
</html>
