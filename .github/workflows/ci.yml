name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Python API tests (SQLite + mocked Redis)
  # ──────────────────────────────────────────────
  test:
    name: API Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentwallet

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('agentwallet/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.11-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest packages/api/tests/ -v --tb=short

  # ──────────────────────────────────────────────
  # Job 2: Lint with ruff (non-blocking)
  # ──────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentwallet

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff>=0.5

      - name: Run ruff check
        run: ruff check packages/api/ --output-format=github
        continue-on-error: true

      - name: Run ruff format check
        run: ruff format --check packages/api/
        continue-on-error: true

  # ──────────────────────────────────────────────
  # Job 3: Dashboard build (runs in parallel)
  # ──────────────────────────────────────────────
  dashboard:
    name: Dashboard Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentwallet/packages/dashboard

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: agentwallet/packages/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run build

  # ──────────────────────────────────────────────
  # Job 3: Deploy to Railway (master only, after CI passes)
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [test, dashboard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    defaults:
      run:
        working-directory: agentwallet

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Deploys the agentwallet/ subdirectory to Railway with a long-lived
      # project token (never expires, unlike the short-lived OAuth token from
      # `railway login`). Create one from the Railway dashboard:
      #   Project -> Settings -> Tokens -> New token
      # Name the GitHub secret RAILWAY_TOKEN with that value.
      # NOTE: `railway link` needs user identity and fails with an API token,
      # so we pass --service/--environment to `railway up` directly instead.
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -e
          railway up --service api --environment production --detach --yes || {
            echo "::error::Railway deploy failed. The RAILWAY_TOKEN may have"
            echo "::error::expired or been rotated. Create a fresh project token in"
            echo "::error::the Railway dashboard (Project -> Settings -> Tokens) and"
            echo "::error::update the RAILWAY_TOKEN secret in repo Settings -> Secrets."
            exit 1
          }
